# Drift correction.
#
# GitHub has `issue_dependencies` and `sub_issues` webhook events, but neither is
# available as an Actions trigger — only `issues` is. Wayfinder wires blocking
# edges in a second pass after creating tickets, so a freshly charted ticket
# shows as Ready until something re-derives it. Sibling recompute on close covers
# the transition that matters during a session; this sweep catches the rest.
#
# This lives ONLY in the hub. Hourly across the waking window is ~456 runs/month
# against the 2,000 minute budget a Free plan allows (Team: 3,000); the same cron
# copied into six repos would be ~2,700. Do not make it more frequent, and do not
# move it into the stub.
name: wayfinder reconcile

on:
  schedule:
    # Hourly 04:17-18:17 UTC, off the hour to dodge scheduler contention. Actions
    # cron is UTC and never observes DST, so the window is chosen to sit inside
    # 05:00-20:00 Europe/Amsterdam under BOTH offsets: 06:17-20:17 CEST and
    # 05:17-19:17 CET. Widening it either end fires during the quiet hours in one
    # half of the year. Overnight drift is caught by the first morning sweep, or
    # by workflow_dispatch.
    - cron: '17 4-18 * * *'
  workflow_dispatch:

# A sweep and an event-driven sync writing the same card would race.
concurrency:
  group: wayfinder-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.WAYFINDER_APP_ID }}
          private-key: ${{ secrets.WAYFINDER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: ./
        with:
          token: ${{ steps.app-token.outputs.token }}
          project-owner: ${{ vars.PROJECT_OWNER || github.repository_owner }}
          project-number: ${{ vars.PROJECT_NUMBER }}
          mode: reconcile
