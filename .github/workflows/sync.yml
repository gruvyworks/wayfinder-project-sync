# Thin wrapper that participating repos call. See stub/wayfinder.yml.
#
# The board's identity lives here, in the hub, so adding a repo never means
# configuring the board again. A caller may override either input if it ever
# needs to feed a different board.
name: wayfinder sync

on:
  workflow_call:
    inputs:
      project-number:
        description: "The board's number. Defaults to the hub's board."
        required: false
        type: string
        default: '1'
      project-owner:
        description: 'Login owning the board.'
        required: false
        type: string
        default: 'gruvyworks'
    secrets:
      WAYFINDER_APP_ID:
        description: 'GitHub App ID. Must exist in the CALLING repo.'
        required: true
      WAYFINDER_APP_PRIVATE_KEY:
        description: 'GitHub App private key (PEM). Must exist in the CALLING repo.'
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Cheap gate before spending a runner: only wayfinder issues can change a
    # card, and most issues in a participating repo are not wayfinder issues.
    if: contains(toJSON(github.event.issue.labels.*.name), 'wayfinder:')
    steps:
      # An installation token, minted per run and expiring in an hour — nothing
      # long-lived to rotate. `owner` widens it from this repo to the whole
      # installation, which sibling recompute needs: a map's children may live
      # in a different repo than the map itself.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.WAYFINDER_APP_ID }}
          private-key: ${{ secrets.WAYFINDER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # `uses:` cannot be interpolated, so this reference is a literal. A fork
      # into another organisation must edit this one line — see README.
      - uses: gruvyworks/wayfinder-project-sync@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          project-owner: ${{ inputs.project-owner }}
          project-number: ${{ inputs.project-number }}
          mode: event
