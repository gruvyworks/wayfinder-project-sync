# Copy to .github/workflows/wayfinder.yml in each participating repo.
#
# Two one-time steps per repo:
#   1. drop this file in
#   2. add the WAYFINDER_APP_ID and WAYFINDER_APP_PRIVATE_KEY secrets
#
# `secrets: inherit` passes the CALLING repo's secrets, not the hub's, so both
# must exist in every participating repo. Organisation-level secrets would avoid
# the per-repo copy, but they are not accessible to private repos on GitHub Free.
name: wayfinder

on:
  issues:
    types: [opened, labeled, unlabeled, assigned, unassigned, closed, reopened]

jobs:
  sync:
    uses: gruvyworks/wayfinder-project-sync/.github/workflows/sync.yml@v1
    secrets: inherit
